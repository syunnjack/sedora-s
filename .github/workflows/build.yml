name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BarcodeWorkInfoComplete.csproj
      - name: Build
        run: dotnet build BarcodeWorkInfoComplete.csproj --configuration Release --no-restore

